[project]
name = "ghi-man-hinh"
version = "0.1.0"
description = "Ứng dụng ghi hình và chụp ảnh màn hình siêu tốc sử dụng BetterCam DXGI & PySide6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bettercam>=1.0.0",
    "imageio-ffmpeg>=0.6.0",
    "keyboard>=0.13.5",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyside6>=6.11.2",
    "pyaudiowpatch>=0.2.12.9",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
ghi-man-hinh = "ghi_man_hinh:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
